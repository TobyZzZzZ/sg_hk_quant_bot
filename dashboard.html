<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quant Bot Dashboard</title>
    <!-- 引入 Tailwind CSS 进行快速优美的排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 ECharts 绘制图表 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-6">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">
            📈 Grid Bot Dashboard 
            <span id="last-update" class="text-sm text-gray-400 font-normal ml-4">Waiting for data...</span>
        </h1>
        
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-6">
            <!-- 动态折线图：记录价格和净值 -->
            <div class="col-span-1 xl:col-span-2 bg-gray-800 rounded-lg p-4 shadow-lg border border-gray-700">
                <h2 class="text-xl font-semibold mb-2 text-center text-gray-200">Price & Net Worth Trend</h2>
                <div id="line-chart" style="width: 100%; height: 400px;"></div>
            </div>
            
            <!-- 饼状图：展示持仓市值比例 -->
            <div class="bg-gray-800 rounded-lg p-4 shadow-lg border border-gray-700">
                <h2 class="text-xl font-semibold mb-2 text-center text-gray-200">Asset Composition</h2>
                <div id="pie-chart" style="width: 100%; height: 400px;"></div>
            </div>
        </div>

        <!-- 当前 Pending 订单模块 -->
        <div class="bg-gray-800 rounded-lg p-4 shadow-lg border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-center text-gray-200">Pending Limit Orders (BTC/USD)</h2>
            <div class="grid grid-cols-2 gap-8">
                <!-- 左列：买单 (绿色) -->
                <div>
                    <h3 class="text-lg font-bold text-center text-emerald-400 mb-2">Buy Orders (Bids)</h3>
                    <div class="overflow-y-auto max-h-96">
                        <table class="w-full text-center text-sm">
                            <thead class="sticky top-0 bg-gray-800 border-b border-gray-600 text-gray-400">
                                <tr><th class="py-2">Price (USD)</th><th class="py-2">Quantity (BTC)</th></tr>
                            </thead>
                            <tbody id="buy-orders-body"></tbody>
                        </table>
                    </div>
                </div>
                
                <!-- 右列：卖单 (红色) -->
                <div>
                    <h3 class="text-lg font-bold text-center text-rose-400 mb-2">Sell Orders (Asks)</h3>
                    <div class="overflow-y-auto max-h-96">
                        <table class="w-full text-center text-sm">
                            <thead class="sticky top-0 bg-gray-800 border-b border-gray-600 text-gray-400">
                                <tr><th class="py-2">Price (USD)</th><th class="py-2">Quantity (BTC)</th></tr>
                            </thead>
                            <tbody id="sell-orders-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化 ECharts 实例，使用暗黑主题
        const lineChart = echarts.init(document.getElementById('line-chart'), 'dark');
        const pieChart = echarts.init(document.getElementById('pie-chart'), 'dark');

        // 配置折线图 (双 Y 轴)
        const lineOption = {
            backgroundColor: 'transparent',
            tooltip: { trigger: 'axis' },
            legend: { data: ['BTC Price', 'Net Worth'], textStyle: { color: '#ccc' } },
            grid: { left: '2%', right: '2%', bottom: '3%', containLabel: true },
            xAxis: { type: 'category', boundaryGap: false, data: [] },
            yAxis: [
                {
                    type: 'value', name: 'BTC Price', position: 'left', scale: true,
                    axisLabel: { formatter: '${value}' },
                    splitLine: { lineStyle: { color: '#374151' } }
                },
                {
                    type: 'value', name: 'Net Worth', position: 'right', scale: true,
                    axisLabel: { formatter: '${value}' },
                    splitLine: { show: false }
                }
            ],
            series: [
                {
                    name: 'BTC Price', type: 'line', yAxisIndex: 0, data: [],
                    smooth: true, showSymbol: false, itemStyle: { color: '#F59E0B' } // 橙色
                },
                {
                    name: 'Net Worth', type: 'line', yAxisIndex: 1, data: [],
                    smooth: true, showSymbol: false, itemStyle: { color: '#3B82F6' } // 蓝色
                }
            ]
        };

        // 配置饼状图
        const pieOption = {
            backgroundColor: 'transparent',
            tooltip: { 
                trigger: 'item',
                formatter: function(params) {
                    // 自定义提示框，展示数量和市值
                    return `<strong>${params.name}</strong><br/>` + 
                           `Amount: ${params.data.amount}<br/>` + 
                           `Market Value: $${params.value} (${params.percent}%)`;
                }
            },
            legend: { top: 'bottom', textStyle: { color: '#ccc' } },
            series: [
                {
                    name: 'Assets', type: 'pie', radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: { borderRadius: 10, borderColor: '#1f2937', borderWidth: 2 },
                    label: { show: false, position: 'center' },
                    emphasis: { label: { show: true, fontSize: 20, fontWeight: 'bold' } },
                    labelLine: { show: false },
                    data: []
                }
            ]
        };

        lineChart.setOption(lineOption);
        pieChart.setOption(pieOption);

        // 获取并渲染数据
        async function fetchAndUpdateData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                // 1. 更新最新抓取时间
                document.getElementById('last-update').innerText = `Last Updated: ${data.last_update}`;

                // 2. 渲染折线图
                const times = data.history.map(d => d.time);
                const prices = data.history.map(d => d.btc_price);
                const netWorths = data.history.map(d => d.net_worth.toFixed(2));
                
                lineChart.setOption({
                    xAxis: { data: times },
                    series: [{ data: prices }, { data: netWorths }]
                });

                // 3. 渲染饼状图 (包含持仓数量 amount 和 估值 value)
                const pieData = Object.keys(data.assets).map(coin => ({
                    name: coin,
                    value: data.assets[coin].value.toFixed(2),
                    amount: data.assets[coin].amount.toFixed(6)
                }));
                pieChart.setOption({ series: [{ data: pieData }] });

                // 4. 渲染未成交买卖单
                const buyBody = document.getElementById('buy-orders-body');
                buyBody.innerHTML = '';
                data.pending_buy.forEach(order => {
                    buyBody.innerHTML += `<tr class="border-b border-gray-700/50 hover:bg-gray-700/30">
                        <td class="py-2 text-emerald-400 font-mono">${order.price.toFixed(2)}</td>
                        <td class="py-2 text-gray-300 font-mono">${order.qty}</td>
                    </tr>`;
                });

                const sellBody = document.getElementById('sell-orders-body');
                sellBody.innerHTML = '';
                data.pending_sell.forEach(order => {
                    sellBody.innerHTML += `<tr class="border-b border-gray-700/50 hover:bg-gray-700/30">
                        <td class="py-2 text-rose-400 font-mono">${order.price.toFixed(2)}</td>
                        <td class="py-2 text-gray-300 font-mono">${order.qty}</td>
                    </tr>`;
                });

            } catch (err) {
                console.error("Failed to fetch dashboard data:", err);
            }
        }

        // 每 10 秒请求一次前端更新
        setInterval(fetchAndUpdateData, 10000);
        fetchAndUpdateData();

        // 窗口大小变动时，图表自动重新适配
        window.addEventListener('resize', () => {
            lineChart.resize();
            pieChart.resize();
        });
    </script>
</body>
</html>
